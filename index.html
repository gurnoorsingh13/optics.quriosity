  <!-- ================= MAIN COLUMN ================= -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <nav class="crumbs" aria-label="Location"><span class="c-muted" id="crumbSection">Experiments</span><span class="c-muted">/</span><span class="c-title" id="crumbTitle"></span><span class="tag" id="crumbEdited" hidden>Edited</span></nav>
      <div class="top-actions">
        <label class="grid-size hide-md" for="gn">Grid <input type="number" id="gn" min="1" max="14" aria-label="Columns"> × <input type="number" id="gm" min="1" max="14" aria-label="Rows"></label>
        <span class="sep hide-md"></span>
        <button class="icon-btn" id="undo" title="Undo (Ctrl Z)" aria-label="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button class="icon-btn" id="redo" title="Redo (Ctrl Shift Z)" aria-label="Redo"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
        <button class="status btn-ghost hide-sm" id="status" style="border:0;background:none;cursor:pointer"><span class="dot ok" id="statusDot"></span><span id="statusText"></span></button>
        <button class="btn hide-sm" id="formulaBtn" title="Change the formula"></button>
        <button class="btn btn-primary" id="exportBtn" aria-haspopup="menu"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Export</button>
      </div>
    </header>

    <!-- Optical table -->
    <section class="stage" id="stage" aria-label="Optical table">
      <svg id="table" role="img" aria-label="Optical table drawing"></svg>
      <div class="float legend" id="legend"></div>
      <div class="float pill zoom">
        <button class="icon-btn lbl-btn" id="lblBtn" title="Show a† labels on edges">a†</button><span class="sep"></span>
        <button class="icon-btn" id="zoomOut" aria-label="Zoom out" title="Zoom out"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-3.5-3.5"/></svg></button>
        <button class="icon-btn" id="zoomFit" aria-label="Fit to screen" title="Fit to screen (0)"><svg class="i" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
        <button class="icon-btn" id="zoomIn" aria-label="Zoom in" title="Zoom in"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M20 20l-3.5-3.5"/></svg></button>
      </div>
      <div class="float coords" id="coords"></div>
      <div class="float pill timeline" role="group" aria-label="Timeline">
        <button class="icon-btn play" id="play" aria-label="Play" title="Play / pause (Space)"><svg class="i" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none"/></svg></button>
        <button class="icon-btn" id="stepBack" aria-label="Previous step" title="Previous step (←)"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="icon-btn" id="stepFwd" aria-label="Next step" title="Next step (→)"><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
        <input type="range" id="tslider" min="0" max="0" value="0" aria-label="Time step">
        <span class="t" id="tlabel">0 / 0</span>
        <span class="sep speed"></span>
        <select id="speed" class="speed" aria-label="Playback speed"><option value="900">0.5×</option><option value="520" selected>1×</option><option value="260">2×</option><option value="120">4×</option></select>
      </div>
      <div class="tooltip" id="tip" hidden></div>
    </section>

    <!-- Analysis drawer -->
    <section class="drawer" id="drawer" aria-label="Analysis">
      <div class="drawer-grip" id="drawerGrip" title="Drag to resize"></div>
      <div class="tabs" role="tablist" id="drawerTabs">
        <button class="tab on" data-drawer="results" role="tab">Results</button>
        <button class="tab" data-drawer="evolution" role="tab">Evolution</button>
        <button class="tab" data-drawer="sweep" role="tab">Sweep</button>
        <button class="tab" data-drawer="code" role="tab">Python</button>
        <button class="tab" data-drawer="checks" role="tab">Checks <span class="count" id="countChecks"></span></button>
        <div class="tools"><button class="icon-btn" id="drawerToggle" aria-label="Fold the analysis panel"></button></div>
      </div>
      <div class="drawer-body">
        <div id="drawer-results"></div>
        <div id="drawer-evolution" hidden></div>
        <div id="drawer-sweep" hidden></div>
        <div id="drawer-code" hidden></div>
        <div id="drawer-checks" hidden></div>
      </div>
    </section>
  </main>

  <!-- ================= RIGHT PANEL ================= -->
  <aside class="inspector" aria-label="Details">
    <div class="tabs" role="tablist" id="sideTabs">
      <button class="tab on" data-side="props" role="tab">Properties</button>
      <button class="tab" data-side="input" role="tab">Input</button>
      <button class="tab" data-side="ai" role="tab">Assistant</button>
    </div>
    <div class="pane" id="pane-props"></div>
    <div class="pane" id="pane-input" hidden></div>
    <div class="pane" id="pane-ai" hidden></div>
  </aside>
</div>

<!-- ================= WINDOWS ================= -->
<dialog id="settings" aria-label="Settings">
  <div class="set-wrap">
    <nav class="set-nav"><div class="set-title">Settings</div><div id="settingsNav" style="display:contents"></div></nav>
    <div class="set-main"><button class="icon-btn set-close" data-close aria-label="Close settings"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button><div id="settingsBody"></div></div>
  </div>
</dialog>

<dialog id="cmdk" aria-label="Search and commands">

  <div id="cmdList" role="listbox"></div>
  <div class="cmd-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> to move</span><span><kbd>Enter</kbd> to choose</span><span><kbd>Esc</kbd> to close</span></div>
</dialog>

<div class="menu" id="exportMenu" role="menu" hidden></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
