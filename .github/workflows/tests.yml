name: Tests

on:
  push:
  pull_request:

jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check every script parses
        run: for f in config.js scripts/*.js scripts/*/*.js tests/*.js; do node --check "$f"; done
      - name: Run physics tests
        run: node tests/run-tests.js
